runner: http-conformance
instrumented_library: starlette
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- uv sync --frozen --project .

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --target python3* uv run --frozen --project . python scenario.py
