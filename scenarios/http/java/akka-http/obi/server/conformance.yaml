runner: http-conformance
instrumented_library: akka-http
instrumentation_library: go.opentelemetry.io/obi

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-obi install -- otel-conformance-java prepare akka-http:obi

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run: otel-http-drive --serve otel-conformance-obi run --target java otel-conformance-java run akka-http:obi AkkaHttpObiServerScenario
