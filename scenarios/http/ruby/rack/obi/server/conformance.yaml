runner: http-conformance
instrumented_library: rack
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-ruby install

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --target ruby* otel-conformance-ruby run scenario.rb
