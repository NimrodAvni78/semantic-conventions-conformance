runner: genai-conformance
instrumented_library: together
instrumentation_library: go.opentelemetry.io/obi
setup: otel-conformance-obi install -- uv sync --frozen --project .
server:
  run: genai-mock-server --port ${PORT}
env:
  TOGETHER_BASE_URL: ${MOCK_SERVER_URL}/v1
  TOGETHER_API_KEY: test_together_api_key
scenarios:
  inference:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/inference.py
  streaming:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/streaming.py
  tool_calling:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/tool_calling.py
  structured_output:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/structured_output.py
  multimodal:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/multimodal.py
  embeddings:
    run: otel-conformance-obi run --target python3* uv run --frozen --project . python ../scenarios/embeddings.py
